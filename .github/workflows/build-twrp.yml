name: Build TWRP for MS600

# 手动触发 + push 触发
on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP manifest 分支'
        required: true
        default: 'twrp-8.1'
      device_path:
        description: '设备树路径'
        required: true
        default: 'device/iflytek/MS600'
      device_codename:
        description: '设备代号'
        required: true
        default: 'MS600'
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build TWRP recovery
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          echo "=== 编译前可用空间 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "=== 释放后 ==="
          df -h /

      - name: 安装 JDK 8（AOSP 8.1 编译必需）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python-is-python3 bc rsync ccache \
            imagemagick libssl-dev python3-lib2to3 \
            lib32readline-dev liblz4-tool gperf g++-multilib gcc-multilib
          echo "=== Java 版本 ==="
          java -version 2>&1 || true

      - name: 配置 git 与 repo
        run: |
          git config --global user.name "TWRP Builder"
          git config --global user.email "builder@github.actions"
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 缓存 repo 源码（可选，加速）
        uses: actions/cache@v4
        with:
          path: |
            ~/twrp/.repo
          key: twrp-repo-${{ github.event.inputs.manifest_branch || 'twrp-8.1' }}-${{ github.run_id }}
          restore-keys: |
            twrp-repo-${{ github.event.inputs.manifest_branch || 'twrp-8.1' }}-

      - name: 同步 TWRP 源码
        run: |
          BRANCH="${{ github.event.inputs.manifest_branch || 'twrp-8.1' }}"
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b "$BRANCH" || \
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni -b "$BRANCH"
          # 多线程同步，失败重试
          for i in 1 2 3; do
            repo sync -j8 --force-sync --no-clone-bundle --no-tags && break || sleep 10
          done
          echo "=== 源码同步完成 ==="
          du -sh ~/twrp

      - name: 修复 Python 2 遗留脚本（关键！）
        run: |
          # TWRP 8.1 (Android 8.1, 2017~2018 年) 的辅助脚本是 Python 2 写的，
          # 而 Ubuntu 22.04 runner 只有 Python 3，直接跑会报
          #   SyntaxError: multiple exception types must be parenthesized
          # 实例：vendor/omni/build/tools/roomservice.py 第 109 / 166 行
          #        except IOError, ES.ParseError:
          # lunch 阶段会调用 roomservice.py → 语法错误 → lunch 失败 → 编译中止
          cd ~/twrp
          python3 "$GITHUB_WORKSPACE/fix_python2.py"
          echo "=== 复查 roomservice.py ==="
          grep -n 'except' vendor/omni/build/tools/roomservice.py | head -20 || true
          echo "=== 语法自检（关键脚本）==="
          python3 -m py_compile vendor/omni/build/tools/roomservice.py && echo "  OK: roomservice.py" || echo "  仍有错: roomservice.py"

      - name: 放入设备树
        run: |
          DEVICE="${{ github.event.inputs.device_path || 'device/iflytek/MS600' }}"
          CODENAME="${{ github.event.inputs.device_codename || 'MS600' }}"
          cd ~/twrp
          mkdir -p "$(dirname "$DEVICE")"
          cp -r "$GITHUB_WORKSPACE/$DEVICE" "$DEVICE"
          echo "=== 设备树内容 ==="
          ls -la "$DEVICE"
          echo "=== 设备树大小 ==="
          du -sh "$DEVICE"

      - name: 编译 TWRP
        id: build
        run: |
          CODENAME="${{ github.event.inputs.device_codename || 'MS600' }}"
          cd ~/twrp
          source build/envsetup.sh
          # 设备树没有 dependencies 文件，必须允许缺失依赖，否则 lunch 会失败
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch omni_${CODENAME}-eng
          echo "=== 开始编译 ==="
          # 16GB 内存给 -j4 稳妥
          set -o pipefail
          mka recoveryimage -j4 2>&1 | tee build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/twrp/build.log
          if-no-files-found: ignore

      - name: 上传 recovery.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery-MS600
          path: |
            ~/twrp/out/target/product/MS600/recovery.img
            ~/twrp/out/target/product/MS600/recovery.tar
            ~/twrp/out/target/product/MS600/*.img
          if-no-files-found: warn
